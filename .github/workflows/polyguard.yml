# Run PolyGuard against your chatbot's system prompt on every change to it, and
# fail the build if the bot became measurably easier to break.
#
# This is the point of the CLI. A scanner you have to remember to open is a
# scanner nobody runs twice. This one runs itself, and it only fails on evidence:
# the regression verdict is a paired test across languages, not a pooled count of
# attacks, so ordinary run-to-run wobble does not stop your deploy.
#
# Setup:
#   1. Put your bot's system prompt in a file, e.g. prompts/support-bot.txt
#   2. Add ANTHROPIC_API_KEY to the repository secrets
#   3. Commit a baseline:  polyguard scan --prompt prompts/support-bot.txt \
#                                         --out baselines/support-bot.json
#
# Costs money on every run, so it is scoped to changes to the prompt itself.

name: PolyGuard

on:
  pull_request:
    paths:
      - "prompts/**"
      - ".github/workflows/polyguard.yml"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Self-check first. If PolyGuard's own tests do not pass, its verdict about
      # your bot is not worth acting on.
      - name: Verify PolyGuard itself
        run: |
          python validate_bank.py
          python test_engine.py
          python verify_all.py

      - name: Scan the system prompt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python cli.py scan \
            --prompt prompts/support-bot.txt \
            --baseline baselines/support-bot.json \
            --fail-on-regression \
            --out scan.json \
            --html report.html \
            --quiet

      # Uploaded even when the previous step failed, because the report is most
      # useful precisely when the build broke.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyguard-report
          path: |
            scan.json
            report.html

      - name: Comment the result on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('scan.json')) return;
            const s = JSON.parse(fs.readFileSync('scan.json', 'utf8'));
            const pct = v => v == null ? 'n/a' : `${Math.round(v * 100)}%`;
            const c = s.comparison || {};
            const verdict = c.regressed
              ? '**Regression.** This prompt is measurably easier to break than the baseline.'
              : 'No regression detected.';
            const body = [
              '### PolyGuard', '', verdict, '',
              `- victim model: \`${s.model}\``,
              `- attacks: ${s.attacks_fired}, broke: ${s.attacks_broke} (${pct(s.overall_break_rate)})`,
              c.languages_worse != null
                ? `- languages worse: ${c.languages_worse}, better: ${c.languages_better}` +
                  (c.sign_test ? ` (paired sign test p=${Number(c.sign_test.p).toPrecision(3)})` : '')
                : '',
              '', 'Full report in the workflow artifacts.'
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
